services:
  db:
    image: postgres:16-alpine
    container_name: ktm-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:5432"
    volumes:
      - ktm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktm-app
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL}
      FRPS_BIND_ADDR: ${FRPS_BIND_ADDR}
      FRPS_BIND_PORT: ${FRPS_BIND_PORT}
      FRPS_SERVER_ADDR: ${FRPS_SERVER_ADDR}
      FRPS_GLOBAL_TOKEN: ${FRPS_GLOBAL_TOKEN}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION}
      USE_S3_UPLOAD: ${USE_S3_UPLOAD}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USE_TLS: ${MAIL_USE_TLS}
      MAIL_USE_SSL: ${MAIL_USE_SSL}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_KEY: ${S3_KEY}
      S3_SECRET: ${S3_SECRET}
    restart: unless-stopped

volumes:
  ktm-db-data:
