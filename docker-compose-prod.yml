services:
  db:
    image: postgres:16-alpine
    container_name: ktm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ktm}
      POSTGRES_USER: ${POSTGRES_USER:-kanara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ktm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanara} -d ${POSTGRES_DB:-ktm}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktm-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kanara}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-ktm}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      FRPS_BIND_ADDR: 0.0.0.0
      FRPS_BIND_PORT: ${FRPS_BIND_PORT:-7000}
      FRPS_GLOBAL_TOKEN: ${FRPS_GLOBAL_TOKEN:-change-this-frp-token}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-true}
      USE_S3_UPLOAD: ${USE_S3_UPLOAD:-false}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.zoho.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_KEY: ${S3_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
    ports:
      - "${APP_HOST_PORT:-5000}:5000"
      - "${FRPS_HOST_PORT:-7000}:7000"
    restart: unless-stopped

volumes:
  ktm-db-data:
